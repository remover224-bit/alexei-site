<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Сайт для Алексея</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; overflow: hidden; user-select: none; }
    
    body {
      background-color: #111;
      background-image: radial-gradient(circle, #333 2px, transparent 2px);
      background-size: 30px 30px;
      width: 100vw; height: 100vh; position: relative; cursor: crosshair;
      transition: filter 0.3s ease;
    }

    /* Эффект тумана (дебафф) */
    body.foggy { filter: blur(3px) brightness(0.5); }

    /* Слой для фона */
    #fullscreen-bg {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-size: cover; background-position: center; background-repeat: no-repeat;
      z-index: 5; 
      opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
    }
    #fullscreen-bg.active { opacity: 1; }

    /* Летающие картинки */
    .flying-image {
      position: absolute; width: 100px; height: 130px;
      border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.8);
      border: 3px solid #fff; pointer-events: auto; cursor: crosshair;
      background-color: #333; z-index: 10;
      animation: appear 0.2s ease-out forwards;
      display: flex; align-items: center; justify-content: center;
      color: #ff4d4d; font-weight: bold; font-size: 12px; font-family: sans-serif;
      text-align: center;
      transition: width 0.3s, height 0.3s; /* Плавное изменение размера для ивента */
    }

    /* Эффект золотой лихорадки (бафф) */
    .flying-image.golden {
      width: 200px; height: 260px;
      border-color: gold;
      box-shadow: 0 0 30px gold;
      z-index: 20;
    }

    .flying-image img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; pointer-events: none; }

    @keyframes appear { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* Фоновый текст */
    .bg-text {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-family: system-ui, sans-serif; font-size: 15vw; font-weight: 900;
      color: rgba(255, 255, 255, 0.05); white-space: nowrap; pointer-events: none;
      z-index: 1; transition: opacity 0.4s ease;
    }
    .bg-text.hidden { opacity: 0; }

    /* --- ДОСТИЖЕНИЯ --- */
    #achievements-container {
      position: fixed; top: 20px; right: 20px;
      display: flex; flex-direction: column; gap: 10px;
      z-index: 10000; pointer-events: none;
    }

    .achievement-toast {
      background: linear-gradient(135deg, #1e1b4b, #0f172a);
      border: 2px solid #00f2fe; border-radius: 12px;
      padding: 12px 20px; color: white;
      box-shadow: 0 5px 20px rgba(0, 242, 254, 0.4);
      display: flex; align-items: center; gap: 15px;
      animation: slideIn 0.4s ease-out forwards;
      font-family: system-ui, sans-serif;
    }

    .achievement-toast .icon { font-size: 32px; }
    .achievement-toast .text { display: flex; flex-direction: column; }
    .achievement-toast .title { font-weight: 800; font-size: 16px; color: #00f2fe; }
    .achievement-toast .desc { font-size: 13px; color: #cbd5e1; }

    @keyframes slideIn {
      from { transform: translateX(150%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Счетчик */
    #score-counter {
      position: fixed; top: 20px; left: 20px;
      font-family: system-ui, sans-serif; font-size: 24px; font-weight: 900;
      color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
      z-index: 10000;
      pointer-events: none;
    }

    /* Плашка ивента */
    #event-banner {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #1e1b4b; border: 2px solid #ff4d4d; border-radius: 10px;
      padding: 15px 30px; color: white; font-family: system-ui, sans-serif;
      font-weight: bold; font-size: 18px; text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
      z-index: 10000; pointer-events: none;
      opacity: 0; transition: opacity 0.3s, transform 0.3s;
    }
    #event-banner.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
    #event-banner.buff { border-color: #3ddc97; color: #3ddc97; box-shadow: 0 5px 20px rgba(61, 220, 151, 0.4); }
    #event-banner.debuff { border-color: #ff4d4d; color: #ff4d4d; box-shadow: 0 5px 20px rgba(255, 77, 77, 0.4); }
  </style>
</head>
<body>

  <div id="fullscreen-bg"></div>
  <div class="bg-text" id="bgText">АЛЕКСЕЙ</div>
  
  <div id="achievements-container"></div>
  <div id="score-counter">Поймано: <span id="caught-count">0</span></div>
  <div id="event-banner"></div>

  <script>
    const imageNames = ['1', '2', '3', '4', '5', '6', '7'];
    const activeExt = '.jpg'; 
    const sounds = ['zvuk1.mp3', 'zvuk2.mp3', 'zvuk3.mp3'];
    
    // Базовые настройки
    const MAX_IMAGES = 4;         
    const SPAWN_INTERVAL = 1200;  
    const BASE_LIFETIME = 1200;       
    
    let activeImagesCount = 0;
    let bgTimeout = null;
    
    let caughtCount = 0;
    let unlockedAchievements = [];

    // Глобальные модификаторы для ивентов
    let currentModifier = { size: 'normal', lifetime: BASE_LIFETIME, isGolden: false };

    const fullscreenBg = document.getElementById('fullscreen-bg');
    const bgText = document.getElementById('bgText');
    const caughtCountEl = document.getElementById('caught-count');
    const achievementsContainer = document.getElementById('achievements-container');
    const eventBanner = document.getElementById('event-banner');

    // --- ЗВУКИ ---
    function playRandomSound() {
      try {
        const audio = new Audio(sounds[Math.floor(Math.random() * sounds.length)]);
        audio.volume = 0.5;
        audio.play().catch(() => {});
      } catch (e) {}
    }

    // --- ДОСТИЖЕНИЯ ---
    function showAchievement(title, desc, icon) {
      const el = document.createElement('div');
      el.className = 'achievement-toast';
      el.innerHTML = `<div class="icon">${icon}</div><div class="text"><div class="title">${title}</div><div class="desc">${desc}</div></div>`;
      achievementsContainer.appendChild(el);
      setTimeout(() => {
        el.style.animation = 'slideIn 0.3s ease-in reverse forwards';
        setTimeout(() => el.remove(), 300);
      }, 3000);
    }

    function checkAchievements() {
      if (caughtCount >= 1 && !unlockedAchievements.includes('1')) { unlockedAchievements.push('1'); showAchievement('Первый пошел!', 'Поймай 1 Алексея', '👆'); }
      if (caughtCount >= 5 && !unlockedAchievements.includes('5')) { unlockedAchievements.push('5'); showAchievement('Охотник', 'Поймай 5 Алексеев', '🎯'); }
      if (caughtCount >= 10 && !unlockedAchievements.includes('10')) { unlockedAchievements.push('10'); showAchievement('Ловец', 'Поймай 10 Алексеев', '🔥'); }
      if (caughtCount >= 50 && !unlockedAchievements.includes('50')) { unlockedAchievements.push('50'); showAchievement('Легенда', 'Поймай 50 Алексеев', '🏆'); }
    }

    // --- СИСТЕМА ИВЕНТОВ ---
    function triggerRandomEvent() {
      const events = [
        { type: 'buff', title: '🌟 ЗОЛОТАЯ ЛИХОРАДКА!', desc: 'Алексей стал огромным!', action: () => {
            currentModifier = { size: 'huge', lifetime: BASE_LIFETIME, isGolden: true };
            document.querySelectorAll('.flying-image').forEach(img => img.classList.add('golden'));
        }},
        { type: 'buff', title: '⏳ ЗАМОРОЗКА!', desc: 'Картинки не исчезают!', action: () => {
            currentModifier = { size: 'normal', lifetime: 999999, isGolden: false };
        }},
        { type: 'debuff', title: '🌫️ ТУМАН!', desc: 'Видимость упала!', action: () => {
            document.body.classList.add('foggy');
            currentModifier = { size: 'normal', lifetime: BASE_LIFETIME, isGolden: false };
        }},
        { type: 'debuff', title: '⚡ СПЕШКА!', desc: 'Они исчезают моментально!', action: () => {
            currentModifier = { size: 'normal', lifetime: 500, isGolden: false };
            document.querySelectorAll('.flying-image').forEach(img => img.classList.remove('golden'));
        }}
      ];

      const randomEvent = events[Math.floor(Math.random() * events.length)];
      
      // Показываем плашку
      eventBanner.className = randomEvent.type;
      eventBanner.innerHTML = `<div>${randomEvent.title}</div><div style="font-size:14px; font-weight:normal; margin-top:5px;">${randomEvent.desc}</div>`;
      eventBanner.classList.add('show');

      // Применяем эффект
      randomEvent.action();

      // Убираем эффект через 5 секунд
      setTimeout(() => {
        eventBanner.classList.remove('show');
        document.body.classList.remove('foggy');
        currentModifier = { size: 'normal', lifetime: BASE_LIFETIME, isGolden: false };
        document.querySelectorAll('.flying-image').forEach(img => img.classList.remove('golden'));
      }, 5000);
    }

    // --- ЛОГИКА КАРТИНОК ---
    function spawnImage() {
      if (activeImagesCount >= MAX_IMAGES) return;
      activeImagesCount++;

      const container = document.createElement('div');
      container.classList.add('flying-image');
      if (currentModifier.isGolden) container.classList.add('golden');
      
      const img = document.createElement('img');
      const randomName = imageNames[Math.floor(Math.random() * imageNames.length)];
      const fullImgSrc = randomName + activeExt;
      img.src = fullImgSrc;

      img.onerror = () => {
        img.remove();
        container.textContent = 'НЕТ';
      };

      container.appendChild(img);
      
      // Координаты (учитываем размер)
      const maxX = window.innerWidth - (currentModifier.isGolden ? 220 : 120);
      const maxY = window.innerHeight - (currentModifier.isGolden ? 280 : 150);
      container.style.left = `${Math.random() * maxX}px`;
      container.style.top = `${Math.random() * maxY}px`;

      // КЛИК
      container.addEventListener('pointerdown', (e) => {
        e.stopPropagation(); 
        playRandomSound();
        
        caughtCount++;
        caughtCountEl.textContent = caughtCount;
        checkAchievements();

        fullscreenBg.style.backgroundImage = `url('${fullImgSrc}')`;
        fullscreenBg.classList.add('active');
        bgText.classList.add('hidden');
        
        container.remove(); 
        activeImagesCount--;

        if (bgTimeout) clearTimeout(bgTimeout);
        bgTimeout = setTimeout(() => { 
          fullscreenBg.classList.remove('active'); 
          bgText.classList.remove('hidden'); 
        }, 1500);
      });

      document.body.appendChild(container);

      // Исчезновение (используем текущий модификатор времени жизни)
      setTimeout(() => {
        if (container.parentNode) {
          container.style.transition = 'opacity 0.2s'; 
          container.style.opacity = '0';
          setTimeout(() => { 
            if (container.parentNode) { 
              container.remove(); 
              activeImagesCount--; 
            } 
          }, 200);
        }
      }, currentModifier.lifetime);
    }

    setInterval(() => { spawnImage(); }, SPAWN_INTERVAL);
    for (let i = 0; i < MAX_IMAGES; i++) { setTimeout(spawnImage, i * 300); }

    // Запускаем ивенты каждые 10 секунд
    setInterval(triggerRandomEvent, 10000);
  </script>
</body>
</html>
